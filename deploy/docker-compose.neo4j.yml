# 历史迁移源：仅用于启动已有 Neo4j 数据并只读导出，不属于当前应用部署。
# 请保留原项目名及原数据卷；导出核对完成前不要删除容器卷。
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: family_tree_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in your shell or .env}
    volumes:
      - family_tree_neo4j_data:/data
      - family_tree_neo4j_logs:/logs
      - family_tree_neo4j_import:/var/lib/neo4j/import
      - family_tree_neo4j_plugins:/plugins
    restart: unless-stopped

volumes:
  family_tree_neo4j_data:
  family_tree_neo4j_logs:
  family_tree_neo4j_import:
  family_tree_neo4j_plugins:
