name: familytree

services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: familytree
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or deploy/.env}
    volumes:
      # PostgreSQL 18 的 PGDATA 位于版本子目录，需挂载父目录。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ../after
      dockerfile: ../deploy/Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: familytree
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or deploy/.env}
      FAMILYTREE_ADMIN_PASSWORD: ${FAMILYTREE_ADMIN_PASSWORD:?set FAMILYTREE_ADMIN_PASSWORD in deploy/.env}
      FAMILYTREE_ADMIN_USERNAME: ${FAMILYTREE_ADMIN_USERNAME:-}
      FAMILYTREE_ADMIN_EMAIL: ${FAMILYTREE_ADMIN_EMAIL:-}
      FAMILYTREE_TEST_PASSWORD: ${FAMILYTREE_TEST_PASSWORD:-}
      FAMILYTREE_TEST_USERNAME: ${FAMILYTREE_TEST_USERNAME:-}
      FAMILYTREE_TEST_EMAIL: ${FAMILYTREE_TEST_EMAIL:-}
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_SENDER_PASSWORD: ${SMTP_SENDER_PASSWORD:-}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
    volumes:
      - ../after/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

