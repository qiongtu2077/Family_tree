version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ../after
      dockerfile: ../deploy/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./family_tree.db
      - SERVER_URL=http://your-domain.com:8000
    volumes:
      - ../after/family_tree.db:/app/family_tree.db
    restart: always

  # 前端服务
  frontend:
    build:
      context: ../front
      dockerfile: ../deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

