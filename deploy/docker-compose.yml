version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: family_tree_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in your shell or .env}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: always

  # 后端服务
  backend:
    build:
      context: ../after
      dockerfile: ../deploy/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./family_tree.db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in your shell or .env}
      - NEO4J_DATABASE=neo4j
      - SERVER_URL=http://your-domain.com:8000
    volumes:
      - ../after/family_tree.db:/app/family_tree.db
    depends_on:
      - neo4j
    restart: always

  # 前端服务
  frontend:
    build:
      context: ../front
      dockerfile: ../deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

